# Runs on the VM. The pipeline sets IMAGE_TAG; the box only pulls from GHCR.
services:
  app:
    image: ghcr.io/htrendafilov/didachedynamis:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "127.0.0.1:8080:8080"   # Cloudflare Tunnel (or another local proxy) reaches this only
    environment:
      - API_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
