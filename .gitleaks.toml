[extend]
useDefault = true

# The chat tests hold OpenRouter-shaped sentinel keys deliberately. targetRules is
# load-bearing: without it a global paths allowlist skips the whole file in
# `gitleaks dir`, so condition = "AND" never gates and a real key there is hidden.
[[allowlists]]
id = "chat-test-sentinels"
description = "OpenRouter-shaped sentinel keys in the chat test suite"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^apps/web/e2e-chat/chat\.spec\.ts$''',
  '''^apps/web/src/chat/(client|credentials)\.test\.ts$''',
  '''^apps/web/src/components/chat/ChatPanel(\.injectionCorpus)?\.test\.tsx$''',
]
regexes = [
  '''sk-or-v1-(TEST|E2E)SENTINEL[0-9A-Za-z]*''',
]
