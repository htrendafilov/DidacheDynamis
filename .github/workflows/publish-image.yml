name: publish image

# Named for what a plain dispatch does: build the image and push it to GHCR. It was `deploy.yml`,
# which promised a deployment it does not perform — production is the native systemd + gunicorn
# service released with the operator's local scripts/release.sh. Not renamed to `release.yml`
# either: that is what release.sh already is, and two things called "release" would be worse than
# one called "deploy".
#
# Deploying is a SEPARATE, OPT-IN job. The rename alone would have swapped one misleading name for
# another — a workflow called "publish image" that also ran `docker compose up -d` the moment the
# VM secrets existed. So the container rollout now requires ticking `deploy_to_vm` on dispatch,
# appears as its own job in the Actions UI, and is skipped (not failed) when it is not requested.
#
# Deliberately manual. The image rebuilds content.sqlite from the committed sources; the optional
# rollout uses VM_HOST/VM_USER/SSH_DEPLOY_KEY/DEPLOY_DIR. Those four secrets are NOT configured
# today, so the rollout cannot run even if requested — production is the native systemd + gunicorn
# path (generic procedure: docs/deployment/; operator values live in the intentionally private live
# runbook), not Docker. The preflight says so plainly rather than letting ssh-action report a bare
# "missing server host".
on:
  workflow_dispatch:
    inputs:
      deploy_to_vm:
        description: "Also roll the pushed image out to the VM (container path — leave off to publish only)"
        type: boolean
        default: false

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      # Must be lowercased, and cannot be an `env:` expression that does it.
      # `github.repository` preserves case, so on htrendafilov/DidacheDynamis it yields
      # ghcr.io/htrendafilov/DidacheDynamis — which Docker rejects outright:
      # "invalid tag: repository name must be lowercase". This was invisible while the repo was
      # `bible_app_bg`, because that name is already lowercase; the rename is what arms it.
      # The lowercased form also matches deploy/docker-compose.yml's ghcr.io/htrendafilov/didachedynamis.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VITE_DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}
            VITE_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Opt-in only. Without this gate a workflow named "publish image" would also change production
  # as soon as the four secrets existed — the same misleading-action problem the rename fixed,
  # pointing the other way. Not requesting a deploy is a success, not a failure: publishing an
  # image is a complete outcome on its own, and a workflow with no green path is a workflow whose
  # red means nothing.
  deploy-to-vm:
    needs: publish
    if: ${{ inputs.deploy_to_vm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The `secrets` context is not available in a step-level `if:`, so this is a scripted
      # preflight rather than a condition. It reports every missing name at once. Reaching it
      # means a deploy was explicitly asked for, so missing secrets are a real failure here.
      - name: Check VM deploy secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          missing=""
          for name in VM_HOST VM_USER SSH_DEPLOY_KEY DEPLOY_DIR; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Container deploy is not configured::Missing secrets:$missing"
            {
              echo "### Container deploy is not configured"
              echo
              echo "The image **was** built and pushed to GHCR by the \`publish\` job — only this"
              echo "opt-in VM rollout is blocked."
              echo
              echo "Missing repository secrets:\`$missing\`"
              echo
              echo "This workflow is the *future* hands-off Docker path. Production runs the native"
              echo "systemd + gunicorn service behind the Cloudflare Tunnel, which this workflow does"
              echo "not touch. Release it with the operator's private live runbook"
              echo "(generic procedure: \`docs/deployment/\`)."
              echo
              echo "To enable this path instead, install Docker on the VM, create a deploy user + key,"
              echo "then set the four secrets above."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Deploy to the VM over SSH. The VM only pulls from GHCR.
      - name: Deploy to VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            # readiness check also catches missing/schema-incompatible content.sqlite
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:${API_PORT:-8080}/ready; then echo "ready"; exit 0; fi
              sleep 2
            done
            echo "readiness check failed"; exit 1
