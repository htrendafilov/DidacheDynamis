name: deploy

# Deliberately manual: the image rebuilds content.sqlite from the committed sources and deploys the
# optional GHCR/Compose path using VM_HOST/VM_USER/SSH_DEPLOY_KEY/DEPLOY_DIR secrets.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VITE_DROPBOX_APP_KEY=${{ secrets.DROPBOX_APP_KEY }}
            VITE_BUILD_ID=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # Deploy to the VM over SSH. The VM only pulls from GHCR.
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            # readiness check also catches missing/schema-incompatible content.sqlite
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:${API_PORT:-8080}/ready; then echo "ready"; exit 0; fi
              sleep 2
            done
            echo "readiness check failed"; exit 1
