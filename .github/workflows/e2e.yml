name: e2e

# Playwright smoke tests over the full stack (FastAPI + built SPA + content.sqlite).
# Runs on every push to main — the repo has been public since 2026-09-03, so Actions is free
# and the manual-only compromise this workflow shipped with has no reason left. A run builds
# the DB + SPA and downloads a browser, so it is minutes, not seconds: still too slow for
# every PR, but main is what gets released, and these specs guard things `ci` cannot —
# the lazy chat chunk, the first-paint bundle, the topical turn, and the axe sweeps.
#
# workflow_dispatch stays, for running the suite on a branch before merging it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release-gating run at a time; a newer push supersedes an older run's answer.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsword-utils unzip
          python -m pip install --upgrade pip
          pip install -e apps/importer -e apps/api
          (cd apps/web && npm ci)

      - name: Build content DB + SPA
        run: |
          bash scripts/fetch-kjv.sh
          bibleimport build-all --sources-dir data/sources --out data/content.sqlite
          (cd apps/web && npm run build)

      - name: Install Playwright browser
        run: (cd apps/web && npx playwright install --with-deps chromium)

      - name: Run smoke tests
        env:
          E2E_REUSE: "1" # DB + SPA were built in the explicit step above
        run: (cd apps/web && npm run e2e)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  chat-smoke:
    # Separate job (not an extra step in `smoke`) so it gets its own runner/workspace:
    # playwright.chat.config.ts's webServer rebuilds the same apps/web/dist and
    # data/content.sqlite as the default config, with VITE_CHAT_ENABLED=true baked in, and
    # the two builds must not share a workspace (see the config file's own warning).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsword-utils unzip
          python -m pip install --upgrade pip
          pip install -e apps/importer -e apps/api
          (cd apps/web && npm ci)

      - name: Install Playwright browser
        run: (cd apps/web && npx playwright install --with-deps chromium)

      - name: Run chat e2e tests
        # No E2E_REUSE here, unlike `smoke`: the content DB + SPA must be built by this
        # config's own webServer so the build actually has VITE_CHAT_ENABLED=true baked in,
        # not reused from `smoke`'s flag-off build.
        run: |
          bash scripts/fetch-kjv.sh
          (cd apps/web && npm run e2e:chat)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        with:
          name: playwright-report-chat
          path: apps/web/playwright-report
          retention-days: 7
