name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The importer's full-source audit test reads data/sources (Git LFS objects).
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Python tooling + packages
        run: |
          python -m pip install --upgrade pip "ruff==0.16.0" pytest
          if [ -f apps/importer/pyproject.toml ]; then pip install -e "apps/importer[dev]"; fi
          if [ -f apps/api/pyproject.toml ]; then pip install -e "apps/api[dev]"; fi

      - name: Fetch checksum-pinned CrossWire KJV build input
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsword-utils unzip
          bash scripts/fetch-kjv.sh

      - name: Run checks
        run: bash scripts/check.sh
