name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python tooling + packages
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f apps/importer/pyproject.toml ]; then pip install -e "apps/importer[dev]"; fi
          if [ -f apps/api/pyproject.toml ]; then pip install -e "apps/api[dev]"; fi

      - name: Run checks
        run: bash scripts/check.sh
